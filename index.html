<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小編經營記：社群經營模擬</title>
<meta name="description" content="你是新上任的小編，老闆給你 12 個月的 KPI：粉絲數與導購營收。選平台、定語氣、排內容、控預算，還要撐住小編體力。每一關都連到真實的內容創作工具。">
<meta name="theme-color" content="#2B1B5A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0FF; --card:#FFFFFF; --ink:#1E1638; --sub:#665E83; --line:#E2DAF5;
  --deep:#2B1B5A; --deep-2:#3E2B7A; --pink:#FF3D7F; --pink-d:#C81E5B; --blue:#3D5AFE; --mint:#13B58C; --amber:#FFB020; --red:#E5383B;
  --plat:#FF3D7F;
  --num:'Space Grotesk','Noto Sans TC',sans-serif;
  --mq:0px; color-scheme:light;
}
html{font-size:16.5px;-webkit-text-size-adjust:100%}
html[data-fs="xl"]{font-size:20px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:500;line-height:1.6;padding-top:var(--mq);
  background:var(--bg) radial-gradient(1200px 500px at 85% -10%,#FFD6E6 0,transparent 60%) no-repeat,radial-gradient(900px 500px at -10% 30%,#D9E0FF 0,transparent 60%) no-repeat;background-color:var(--bg)}
body.has-marquee{--mq:34px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);font-weight:700}
:focus-visible{outline:3px solid #0B57D0;outline-offset:2px}
h1,h2,h3{line-height:1.3;margin:0;font-weight:900}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--deep);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:#FFE3EE;animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:66rem;margin:0 auto;padding:.8rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.top h1{flex:1 1 12rem;font-size:1.45rem;white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.top h1 .logo{display:inline-flex;width:2rem;height:2rem;border-radius:.6rem;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;align-items:center;justify-content:center;font-size:1.1rem}
.top h1 small{font-size:.75rem;color:var(--sub);font-weight:700}
@media (max-width:520px){.top h1{font-size:1.2rem;flex-basis:100%}.top h1 small{display:none}}
.ibtn{min-height:2.6rem;padding:0 .85rem;border:0;border-radius:2rem;background:var(--card);box-shadow:0 1px 0 var(--line),0 0 0 1.5px var(--line);font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:.3rem}
.ibtn .badge{background:var(--pink);color:#fff;border-radius:1rem;padding:0 .45rem;font-size:.75rem}
.warn-line{margin:.4rem 0 0;font-size:.8rem;color:var(--sub)}
.warn-line button{background:none;border:0;padding:0;color:var(--red);font-weight:700;text-decoration:underline;font-size:inherit}

.card{background:var(--card);border-radius:1.3rem;box-shadow:0 10px 30px -18px rgba(43,27,90,.45),0 0 0 1px var(--line);padding:1.05rem 1.15rem;margin-top:.9rem}
.card h2{font-size:1.3rem}
.lead{color:var(--sub);margin:.3rem 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:3rem;border:0;border-radius:2rem;background:var(--deep);color:#fff;font-weight:900;padding:.3rem 1.4rem;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn.pink{background:linear-gradient(135deg,var(--pink),#FF7A59);box-shadow:0 8px 20px -10px var(--pink)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{font-size:1.12rem;min-height:3.3rem;padding:.3rem 1.9rem}
.go{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.small{font-size:.84rem;color:var(--sub)}

/* 首頁 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.2rem;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .ttl{font-size:2.35rem;line-height:1.15}
.hero .ttl span{background:linear-gradient(90deg,var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.chipline{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
.chipline b{background:#fff;border-radius:2rem;padding:.1rem .7rem;font-size:.82rem;box-shadow:0 0 0 1.5px var(--line)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.55rem;margin-top:.7rem}
.opt{border:0;text-align:left;background:#FBF9FF;border-radius:1rem;padding:.7rem .85rem;box-shadow:0 0 0 1.5px var(--line);display:flex;gap:.65rem;align-items:flex-start;line-height:1.35;color:var(--ink)}
.opt:hover{box-shadow:0 0 0 2.5px var(--pink)}
.opt[aria-pressed="true"]{background:#FFF0F6;box-shadow:0 0 0 3px var(--pink)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt .oi{font-size:1.9rem;line-height:1;flex:none}
.opt b{display:block;font-size:1rem}
.opt small{display:block;color:var(--sub);font-size:.8rem;margin-top:.15rem}
.opt .nums{display:flex;flex-wrap:wrap;gap:.2rem .5rem;margin-top:.3rem;font-size:.76rem;font-weight:700;color:var(--deep-2)}
.fit{color:var(--amber);letter-spacing:.04em;font-size:.82rem}
.fld{display:block;font-weight:700;margin-top:.8rem}
.fld input{display:block;width:100%;max-width:22rem;min-height:2.8rem;margin-top:.2rem;padding:.3rem .8rem;border:1.5px solid var(--line);border-radius:2rem;background:#fff;font-weight:500}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.2rem 1rem}
.board{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:.4rem}
.board th,.board td{padding:.3rem .4rem;border-bottom:1px solid var(--line);text-align:left}
.board td.n{text-align:right;font-family:var(--num)}
.tblwrap{overflow-x:auto}
.steps{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.8rem}
.steps span{flex:1 1 5rem;text-align:center;font-size:.76rem;font-weight:700;padding:.3rem .2rem;border-radius:2rem;background:#E9E3FA;color:var(--sub)}
.steps span.on{background:var(--pink);color:#fff}
.steps span.ok{background:var(--deep);color:#fff}
.qbox{background:#FBF9FF;border-radius:1rem;padding:.7rem .9rem;margin-top:.8rem;box-shadow:0 0 0 1.5px var(--line)}
.qbox p.q{font-weight:900;margin:0 0 .4rem}
.qopts{display:flex;flex-wrap:wrap;gap:.45rem}
.qopts button{border:0;border-radius:1rem;padding:.45rem .9rem;min-height:2.7rem;background:#fff;box-shadow:0 0 0 1.5px var(--line);font-weight:700;text-align:left}
.qopts button.right{background:#DDF7EE;box-shadow:0 0 0 2px var(--mint)}
.qopts button.wrong{background:#FDE2E4;box-shadow:0 0 0 2px var(--red)}
.qopts button[disabled]{cursor:default}
.exp{margin:.5rem 0 0;font-size:.9rem;border-left:4px solid var(--deep);padding:.2rem .6rem;background:#fff;border-radius:0 .5rem .5rem 0}
.exp.ok{border-color:var(--mint)}.exp.no{border-color:var(--red)}
.alert{border-radius:1rem;padding:.5rem .8rem;margin-top:.7rem;font-weight:700;font-size:.92rem}
.alert.warn{background:#FFF3D6;color:#6B4300}.alert.ok{background:#DDF7EE;color:#0B5A44}.alert.bad{background:#FDE2E4;color:#7A1B1F}

/* 工具卡 */
.tools{margin-top:1rem;border-top:1.5px dashed var(--line);padding-top:.7rem}
.tools h3{font-size:.98rem;color:var(--sub)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.5rem;margin-top:.4rem}
.tcard{display:flex;gap:.6rem;align-items:center;text-decoration:none;color:var(--ink);background:#fff;border-radius:1rem;padding:.5rem .75rem;box-shadow:0 0 0 1.5px var(--line);line-height:1.3;position:relative}
.tcard:hover{box-shadow:0 0 0 2.5px var(--blue)}
.tcard .ti{font-size:1.5rem;flex:none;width:2.2rem;text-align:center}
.tcard b{font-size:.92rem;display:block}
.tcard small{font-size:.76rem;color:var(--sub);display:block;font-weight:500}
.tcard .st{position:absolute;right:.6rem;top:.35rem;font-size:.7rem;font-weight:900;color:var(--mint)}
.lic{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#e11d2e;margin-right:.25rem;vertical-align:middle}

/* 主畫面：手機＋決策 */
.stage{display:grid;grid-template-columns:20rem minmax(0,1fr);gap:1.1rem;margin-top:.9rem;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.phone{background:#120C26;border-radius:2.4rem;padding:.65rem;box-shadow:0 30px 50px -30px rgba(30,22,56,.8);position:sticky;top:calc(var(--mq) + .6rem);max-width:21rem;margin:0 auto;width:100%}
@media (max-width:860px){.phone{position:static}}
.screen{background:#fff;border-radius:1.9rem;overflow:hidden;position:relative}
.notch{height:1.6rem;display:flex;justify-content:space-between;align-items:center;padding:0 1.1rem;font-size:.72rem;font-weight:700;font-family:var(--num)}
.notch i{width:5rem;height:1.1rem;border-radius:1rem;background:#120C26;display:block}
.pf{padding:.4rem .9rem .7rem;border-bottom:1px solid var(--line)}
.pfrow{display:flex;gap:.7rem;align-items:center}
.ava{width:3.6rem;height:3.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.9rem;background:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--plat);flex:none}
.pfstats{display:flex;gap:.8rem;flex:1;justify-content:space-around;text-align:center}
.pfstats b{display:block;font-family:var(--num);font-size:1.15rem;line-height:1.2}
.pfstats span{font-size:.68rem;color:var(--sub)}
.pfname{font-weight:900;margin-top:.4rem;font-size:.95rem}
.pfname small{display:block;font-weight:500;color:var(--sub);font-size:.74rem}
.kpi{margin-top:.5rem;display:grid;gap:.35rem}
.kbar{font-size:.72rem;color:var(--sub);font-weight:700}
.kbar .tr{height:.45rem;border-radius:1rem;background:#EEE9FB;overflow:hidden;margin-top:.12rem}
.kbar .tr i{display:block;height:100%;border-radius:1rem;background:linear-gradient(90deg,var(--plat),var(--blue));transition:width .6s}
.kbar .tr i.over{background:var(--red)}
.feed{padding:.5rem .7rem .8rem;display:grid;gap:.5rem;background:#FAF8FF;max-height:21rem;overflow:hidden}
.post{background:#fff;border-radius:1rem;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.post .img{height:5.2rem;display:flex;align-items:center;justify-content:center;font-size:2.3rem;position:relative}
.post .img em{position:absolute;left:.5rem;top:.4rem;font-style:normal;font-size:.66rem;font-weight:900;background:rgba(255,255,255,.85);border-radius:1rem;padding:0 .45rem}
.post .cap{padding:.35rem .6rem .45rem;font-size:.78rem;line-height:1.35}
.post .acts{display:flex;gap:.7rem;padding:0 .6rem .45rem;font-size:.74rem;color:var(--sub);font-family:var(--num);font-weight:700}
.post .acts .h{color:var(--pink)}
.stam{padding:.55rem .9rem .8rem;border-top:1px solid var(--line);font-size:.78rem;font-weight:700}
.stam .tr{height:.6rem;border-radius:1rem;background:#EEE9FB;overflow:hidden;margin-top:.2rem}
.stam .tr i{display:block;height:100%;border-radius:1rem;transition:width .6s}
.notif{position:absolute;left:.5rem;right:.5rem;top:1.9rem;background:rgba(30,22,56,.92);color:#fff;border-radius:1rem;padding:.45rem .7rem;font-size:.78rem;display:flex;gap:.5rem;align-items:center;animation:drop .5s cubic-bezier(.2,1.4,.4,1),fadeout .6s ease 3.5s forwards;pointer-events:none}
@keyframes fadeout{to{opacity:0;transform:translateY(-40%)}}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}
.mlabel{display:inline-flex;align-items:center;gap:.4rem;background:var(--deep);color:#fff;border-radius:2rem;padding:.15rem .8rem;font-weight:900;font-family:var(--num)}
.event{background:linear-gradient(135deg,#FFF0F6,#EEF1FF);border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:0 0 0 2px #FFC2D8}
.event h2{font-size:1.3rem;display:flex;gap:.5rem;align-items:center}
.event h2 .ei{font-size:1.9rem}
.event .chs{display:grid;gap:.5rem;margin-top:.7rem}
.event .chs button{border:0;text-align:left;background:#fff;border-radius:1rem;padding:.6rem .9rem;min-height:3rem;box-shadow:0 0 0 1.5px var(--line);font-weight:700}
.event .chs button:hover{box-shadow:0 0 0 2.5px var(--pink)}
.event .result{margin-top:.6rem;background:#fff;border-radius:1rem;padding:.5rem .8rem;border-left:5px solid var(--pink)}
.dec{margin-top:.75rem}
.dec>b{display:block;margin-bottom:.3rem}
.dec>b small{color:var(--sub);font-weight:500;margin-left:.3rem}
.seg{display:flex;flex-wrap:wrap;border-radius:2rem;box-shadow:0 0 0 1.5px var(--line);overflow:hidden;background:#fff}
.seg button{flex:1 1 0;border:0;background:none;padding:.35rem .4rem;min-height:2.6rem;font-weight:700;font-size:.84rem;color:var(--sub);border-right:1px solid var(--line);line-height:1.2}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-size:.68rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
@media (max-width:520px){.mats{grid-template-columns:1fr}}
.mats .opt{padding:.45rem .6rem}
.mats .opt .oi{font-size:1.4rem}
.fc{background:var(--deep);color:#fff;border-radius:1.3rem;padding:.85rem .95rem;margin-top:.9rem}
.fc h3{font-size:1.02rem;color:#FFB3CF}
.fc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.4rem;margin-top:.45rem}
.fc .grid div{background:rgba(255,255,255,.08);border-radius:.8rem;padding:.35rem .6rem}
.fc .grid span{display:block;font-size:.72rem;color:#C9C0EE}
.fc .grid b{font-family:var(--num);font-size:1.1rem}
.fc .neg{color:#FF9FA8}.fc .pos{color:#8CF0CF}
.fc .warnline{background:rgba(255,255,255,.1);border-radius:.6rem;padding:.3rem .6rem;font-size:.82rem;margin-top:.4rem}
.fc .btn{width:100%;margin-top:.7rem}

/* 月報與結算 */
.bigmsg{font-family:var(--num);font-size:2rem;text-align:center;margin:.2rem 0;font-weight:700}
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:760px){.report{grid-template-columns:1fr}}
.pl{width:100%;border-collapse:collapse;font-size:.9rem}
.pl td{padding:.22rem .3rem;border-bottom:1px solid var(--line)}
.pl td.n{text-align:right;font-family:var(--num);font-weight:700}
.pl tr.h td{font-weight:900;color:var(--deep-2);border-bottom:2px solid var(--deep-2);padding-top:.6rem}
.pl .neg{color:var(--red)}.pl .pos{color:var(--mint)}
.tip{display:flex;gap:.5rem;align-items:flex-start;background:#FBF9FF;border-radius:1rem;padding:.5rem .75rem;margin-top:.45rem;font-size:.92rem;flex-wrap:wrap}
.tip .tl{margin-left:auto;flex:none;font-size:.8rem;white-space:nowrap}
.chart svg{display:block;width:100%;height:auto}
.grade{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.grade .g{font-family:var(--num);font-size:4.6rem;line-height:1;width:7rem;height:7rem;border-radius:2rem;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--deep);flex:none;transform:rotate(-4deg)}
.grade .g.S{background:linear-gradient(135deg,var(--pink),var(--amber))}.grade .g.A{background:linear-gradient(135deg,var(--blue),var(--mint))}.grade .g.D{background:#77738A}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.5rem;margin-top:.8rem}
.kp div{background:#FBF9FF;border-radius:1rem;padding:.45rem .75rem;box-shadow:0 0 0 1px var(--line)}
.kp span{display:block;font-size:.76rem;color:var(--sub);font-weight:700}
.kp b{font-size:1.2rem;font-family:var(--num)}
.logl{list-style:none;padding:0;margin:.5rem 0 0}
.logl li{display:flex;gap:.6rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.logl li .m{flex:none;width:3.2rem;font-weight:900;color:var(--deep-2)}
.logl li .p{margin-left:auto;flex:none;font-family:var(--num);font-weight:700}
.pass{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem;margin-top:.6rem}
.pass a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15rem;text-decoration:none;color:var(--ink);background:#fff;border-radius:1rem;padding:.6rem .4rem;box-shadow:0 0 0 1.5px var(--line);font-size:.8rem;line-height:1.3;position:relative}
.pass a .ti{font-size:1.7rem;filter:grayscale(1);opacity:.4}
.pass a.got{background:#FFF0F6;box-shadow:0 0 0 2px var(--pink)}
.pass a.got .ti{filter:none;opacity:1}
.pass a.got::after{content:'已蓋章';position:absolute;right:.25rem;top:.25rem;transform:rotate(12deg);border:2px solid var(--pink);color:var(--pink);border-radius:.4rem;font-size:.62rem;font-weight:900;padding:0 .2rem}

.foot{text-align:center;font-size:.82rem;color:var(--sub);margin-top:2rem}
.foot a{margin:0 .4rem}
#modal{position:fixed;inset:0;background:rgba(20,14,40,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:var(--bg);width:100%;max-width:38rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:1.3rem;padding:1rem 1.1rem}
#modalBox h2{font-size:1.3rem;margin-bottom:.4rem}
#modalBox ul{margin:.3rem 0;padding-left:1.2em}
.stack{display:grid;gap:.45rem;margin-top:.6rem}
.set-sec{border-radius:1rem;margin-bottom:.45rem;background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;font-weight:700;min-height:2.9rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';flex:none;transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:500;font-size:.78rem;color:var(--sub);text-align:right}
.set-body{padding:0 .8rem .8rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:2rem;z-index:90;font-weight:700;max-width:calc(100vw - 2rem)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.hearts i{position:absolute;bottom:-30px;font-style:normal;font-size:1.6rem;animation:rise 2.8s ease-out forwards}
@keyframes rise{to{transform:translateY(-105vh) rotate(25deg);opacity:0}}
#printWm{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#marqueeTrack{animation:marquee-scroll 90s linear infinite!important}}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:12px}
  body{background:#fff;padding:0}
  #marqueeBar,.noprint,.toast,#modal,.top,.warn-line,.foot,.hearts{display:none!important}
  #app{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .grade .g,.kp div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printWm{display:flex!important;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;pointer-events:none}
  #printWm img{width:42%;max-width:380px;opacity:.11}
}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<noscript>這個遊戲需要開啟 JavaScript 才能玩。</noscript>
<script src="data.js"></script>
<script src="watermark.js"></script>
